name: Тесты и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # кнопка «запустить вручную» в интерфейсе GitHub

jobs:
  test:
    name: Автотесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
      - name: Прогнать тесты
        working-directory: backend
        run: pytest -q

  deploy:
    name: Деплой на сервер
    needs: test                       # деплой только если тесты прошли
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Обновить приложение по SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            cd /opt/sendbot
            ./deploy.sh
