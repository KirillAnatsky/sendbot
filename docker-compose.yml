services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sendbot
      POSTGRES_PASSWORD: sendbot
      POSTGRES_DB: sendbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendbot"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sendbot:sendbot@db:5432/sendbot
      MEDIA_DIR: /app/media
      LOG_DIR: /app/logs
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-0}
    volumes:
      - media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
